[project]
name = "intermedio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "fastapi>=0.136.1",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.13.4",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.28",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.46.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]
[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
exclude = [
    ".*\\.ipynb$",
    "../../notebooks/"
]


[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]

[tool.ruff]
exclude = [
    "*.ipynb",
    "../../notebooks",
     ".git",
    ".venv",
    "__pycache__",
]


line-length = 88

[tool.ruff.lint]

select = [
    "E",
    "F",
    "I",
]