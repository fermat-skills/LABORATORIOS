[project]
name = "laboratorios-env"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.136.1,<0.137.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "requests (>=2.34.0,<3.0.0)",
    "ruff (>=0.15.12,<0.16.0)",
    "pyright (>=1.1.409,<2.0.0)",
    "mypy (>=2.1.0,<3.0.0)",
    "pre-commit (>=4.6.0,<5.0.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "uvicorn (>=0.46.0,<0.47.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "python-jose (>=3.5.0,<4.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "aiohttp (>=3.13.5,<4.0.0)"
]

[tool.poetry]
packages = [{include = "laboratorios_env", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.3.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "ruff (>=0.15.12,<0.16.0)",
    "pre-commit>=4.6.0,<5.0.0",
    "uvicorn (>=0.46.0,<0.47.0)",
    "mypy (>=2.1.0,<3.0.0)",
]
[tool.ruff]
line-length = 88


exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "../notebooks",
]



[tool.mypy]
python_version = "3.12"
exclude = "../notebooks/"

[tool.pytest.ini_options]
norecursedirs = ["../notebooks"]

[tool.ruff.lint]

select = [
    "E",
    "F",
    "I",
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402", "F811"]
