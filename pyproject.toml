[project]
name = "laboratorios"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.46.0",
]

[tool.uv.workspace]
members = [
    "my_project",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.format]
quote-style = "double"

exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "../notebooks",
]


[tool.mypy]
python_version = "3.12"
exclude = "../notebooks/"

[tool.pytest.ini_options]
norecursedirs = ["../notebooks"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402", "F811", "B904", "B008"]
